                                    <script>
                                document.addEventListener('DOMContentLoaded', function () {
                                    var audioPlayer = document.getElementById("audio");
        var hiddenProperty = "hidden" in document ? "hidden" : "webkitHidden" in document ? "webkitHidden" : "mozHidden" in document ? "mozHidden" : null;
        var visibilityChangeEvent = hiddenProperty.replace(/hidden/i, "visibilitychange");
        var isTouch = false;
        document.addEventListener(visibilityChangeEvent, function () {
            if (document[hiddenProperty]) {
                audioPlayer.pause();
            } else {
                isTouch && audioPlayer.play();
            }
        });
        document.addEventListener('touchend', function () {
            if (isTouch) return;
            isTouch = true;
            setTimeout(function () {
                audioPlayer.play();
            }, 300);
        });
        if (typeof mraid !== 'undefined') {
            if (mraid.getState() === 'loading') {
                mraid.addEventListener('ready', onMraidReady);
            } else {
                onMraidReady();
            }
        }
        function onMraidReady() {
            mraid.removeEventListener("ready", onMraidReady);
        }
        document.getElementById("cr").addEventListener("click",function() {
            "undefined" != typeof mraid && mraid.open();
        })
    })
</script>
